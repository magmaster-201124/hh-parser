<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Resumetto</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; }
    button { margin-right: 8px; padding: 8px 16px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 14px; }
    #status { margin-top: 12px; color: #555; }
  </style>
</head>
<body>
  <h1>Resumetto — вакансии с контактами</h1>
  <button onclick="collect('trudvsem')">Собрать trudvsem</button>
  <button onclick="collect('hh')">Собрать hh</button>
  <button onclick="loadVacancies(true)">Показать вакансии с телефоном</button>
  <button onclick="loadVacancies(false)">Все вакансии</button>
  <div id="status"></div>
  <p id="vacancies-count"></p>
  <div id="pager">
    <button id="prev-btn" onclick="changePage(-1)">← Назад</button>
    <span id="pager-info"></span>
    <button id="next-btn" onclick="changePage(1)">Вперёд →</button>
  </div>
  <table id="vacancies" hidden>
    <thead><tr>
      <th>#</th><th>Должность</th><th>Компания</th><th>Регион</th>
      <th>Зарплата</th><th>Телефон</th><th>Контакт</th><th>Ссылка</th>
    </tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const PAGE_SIZE = 50;   // вакансий на странице
    let rows = [];          // текущая выборка с бэкенда
    let currentPage = 0;    // номер страницы, начиная с 0

    async function collect(source) {
      const resp = await fetch(`/api/collect/${source}`, { method: "POST" });
      showStatus(await resp.json());
      if (resp.ok) pollStatus(source);
    }

    async function pollStatus(source) {
      const timer = setInterval(async () => {
        const st = (await (await fetch("/api/status")).json())[source];
        if (!st || st.state === "running") return;
        clearInterval(timer);
        const stats = st.state === "done"
          ? `, собрано ${st.collected}, новых ${st.created}, обновлено ${st.updated}`
          : "";
        showStatus(`${source}: ${st.state}${st.reason ? ` — ${st.reason}` : ""}${stats}`);
        if (st.state === "done") await loadVacancies();
      }, 1500);
    }

    async function loadVacancies(hasPhone = false) {
      currentPage = 0;
      const query = hasPhone ? "has_phone=true&" : "";
      const resp = await fetch(`/api/vacancies?${query}limit=250`);
      rows = await resp.json();
      renderPage();
    }

    function renderPage() {
      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (currentPage >= pages) currentPage = pages - 1;
      const start = currentPage * PAGE_SIZE;
      const chunk = rows.slice(start, start + PAGE_SIZE);

      const tbody = document.querySelector("#vacancies tbody");
      tbody.innerHTML = "";
      let n = start + 1;
      for (const v of chunk) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${n++}</td><td>${v.title}</td><td>${v.company ?? ""}</td><td>${v.area ?? ""}</td>` +
          `<td>${v.salary_from ?? "—"}…${v.salary_to ?? "—"} ${v.currency ?? ""}</td>` +
          `<td>${v.phone ?? ""}</td><td>${v.contact_name ?? ""}</td>` +
          `<td><a href="${v.url}">открыть</a></td>`;
        tbody.appendChild(tr);
      }

      document.getElementById("vacancies").hidden = total === 0;
      document.getElementById("pager-info").textContent =
        `Страница ${currentPage + 1} из ${pages} — показано ${chunk.length} из ${total}`;
      document.getElementById("prev-btn").disabled = currentPage === 0;
      document.getElementById("next-btn").disabled = currentPage >= pages - 1;
    }

    function changePage(delta) {
      currentPage += delta;
      renderPage();
    }

    function showStatus(text) {
      document.getElementById("status").textContent =
        typeof text === "string" ? text : JSON.stringify(text);
    }

    loadVacancies();  // заполняем таблицу при открытии страницы
  </script>
</body>
</html>
